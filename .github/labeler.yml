# Label path untuk PR router gratis (.github/workflows/pr-router.yml).
# Labeler tidak pernah menjalankan kode PR; file ini hanya konfigurasi pencocokan path.

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - locales/**

backend:
  - changed-files:
      - any-glob-to-any-file:
          - modules/**

deploy:
  - changed-files:
      - any-glob-to-any-file:
          - "*.bat"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

deps:
  - changed-files:
      - any-glob-to-any-file:
          - "**/requirements*.txt"
          - "**/pyproject.toml"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
